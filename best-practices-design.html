  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4087dff9-3b1f-4506-a47b-76a0e82f20da\"><\u002Fscript>\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =====================================================================\n   Dutch Laravel Foundation — Colors & Type tokens\n   Extracted from tailwind.config.js + resources/css/tailwind.css\n   ===================================================================== */\n\n:root {\n    /* ---------- Brand color palette ---------- */\n    --color-primary-accent: #FF2D20;   /* Laravel red — signature brand color */\n    --color-primary-contrast: #FFFFFF; /* White, on top of red */\n    --color-primary-text: #5F6464;     /* Muted body text on light bg */\n\n    --color-secondary-light: #F5F5FA;  /* Soft lavender-gray background */\n    --color-secondary-dark: #F0F2F1;   /* Slightly cooler soft gray */\n    --color-secondary-contrast: #FF2D20; /* Accent used on secondary bg */\n\n    --color-tertiary-light: #848487;   /* Muted metadata text */\n    --color-tertiary-regular: #525257; /* Default body copy */\n    --color-tertiary-dark: #090910;    /* Near-black, headings & strong copy */\n\n    /* Utility neutrals (from Tailwind defaults actually used in code) */\n    --color-white: #FFFFFF;\n    --color-off-white: #FEFEFE;        /* Input background */\n    --color-border-soft: #ECECEC;      /* Input borders */\n    --color-gray-50: #F9FAFB;\n    --color-gray-100: #F3F4F6;\n    --color-gray-200: #E5E7EB;\n    --color-gray-900: #111827;\n    --color-black: #000000;\n\n    /* ---------- Semantic foreground / background ---------- */\n    --fg-strong: var(--color-tertiary-dark);\n    --fg-default: var(--color-tertiary-regular);\n    --fg-muted: var(--color-tertiary-light);\n    --fg-on-red: var(--color-primary-contrast);\n    --fg-link: var(--color-tertiary-dark);\n    --fg-link-hover: var(--color-primary-accent);\n    --fg-accent: var(--color-primary-accent);\n\n    --bg-page: var(--color-white);\n    --bg-soft: var(--color-secondary-light);\n    --bg-panel: var(--color-secondary-dark);\n    --bg-accent: var(--color-primary-accent);\n    --bg-input: var(--color-off-white);\n\n    /* ---------- Typography ---------- */\n    --font-sans: \"Mulish\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n\n    --font-weight-regular: 400;\n    --font-weight-semibold: 600;\n    --font-weight-bold: 700;\n    --font-weight-extrabold: 800;\n\n    /* Type scale (from tailwind.config.js fontSize) */\n    --text-xs:   12px;  --leading-xs:   2em;\n    --text-sm:   14px;  --leading-sm:   1.714em;\n    --text-base: 16px;  --leading-base: 1.5em;\n    --text-lg:   18px;  --leading-lg:   1.333em;\n    --text-xl:   24px;  --leading-xl:   1.333em;\n    --text-2xl:  30px;  --leading-2xl:  1.333em;\n    --text-3xl:  36px;  --leading-3xl:  1.333em;\n    --text-4xl:  42px;  --leading-4xl:  1.333em;\n    --text-5xl:  48px;  --leading-5xl:  1.167em;\n\n    /* Meta / eyebrow letter-spacing */\n    --tracking-meta: 0.12em;\n\n    /* ---------- Elevation / shadows (verbatim from tailwind config) ---------- */\n    --shadow-custom: 0 10px 15px -3px rgba(0,0,0,0.10), 0 0 6px 0 rgba(0,0,0,0.05);\n    --shadow-3xl: 0 0 32px 0 rgba(0,0,0,0.04), 0 0 24px 0 rgba(0,0,0,0.04);\n    --shadow-inner-primary: inset 0 0 0 1px #FF2D20;\n    --shadow-inner-light: inset 0 0 0 1px rgba(9,9,16,0.2);\n    /* The signature \"offset square\" button/card shadow */\n    --shadow-outer-primary: 4px 4px 0 -1px #FFFFFF, 4px 4px 0 0 #FF2D20;\n    --shadow-outer-dark: 4px 4px 0 -1px #FFFFFF, 4px 4px 0 0 #000000;\n    --shadow-inner-outer-primary: inset 0 0 0 1px #FF2D20, 4px 4px 0 -1px #FFFFFF, 4px 4px 0 0 #FF2D20;\n\n    /* ---------- Shape ---------- */\n    /* DLF is SQUARE. Radii are effectively 0 in all marketing surfaces. */\n    --radius-none: 0;\n    --radius-xs: 2px;    /* rare — tiny chips only */\n    --radius-sm: 4px;    /* code / pill-ish only */\n    --radius-md: 6px;\n    /* No lg/xl/full — avoid in brand surfaces. */\n\n    /* ---------- Borders ---------- */\n    --border-width: 1px;\n    --border-color: var(--color-gray-200);\n    --border-dark: var(--color-tertiary-dark);\n    --border-accent: var(--color-primary-accent);\n\n    /* ---------- Spacing scale (Tailwind default, for reference) ---------- */\n    --space-1: 4px;\n    --space-2: 8px;\n    --space-3: 12px;\n    --space-4: 16px;\n    --space-5: 20px;\n    --space-6: 24px;\n    --space-8: 32px;\n    --space-10: 40px;\n    --space-12: 48px;\n    --space-16: 64px;\n    --space-20: 80px;\n\n    /* ---------- Container ---------- */\n    --container-max: 72rem; /* !max-w-6xl */\n\n    /* ---------- Motion ---------- */\n    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n    --dur-fast: 150ms;  /* @kind other */\n    --dur-base: 200ms;  /* @kind other */\n    --dur-slow: 500ms;  /* @kind other */\n}\n\n/* =====================================================================\n   Semantic element styles (mirrors base @layer in tailwind.css)\n   ===================================================================== */\nhtml {\n    color: var(--fg-default);\n    font-family: var(--font-sans);\n    font-size: var(--text-base);\n    line-height: var(--leading-base);\n    -webkit-font-smoothing: antialiased;\n}\n\nh1, .h1 {\n    font-family: var(--font-sans);\n    font-weight: var(--font-weight-bold);\n    font-size: var(--text-xl);\n    line-height: var(--leading-xl);\n    color: var(--fg-strong);\n    margin: 0 0 var(--space-10) 0;\n    word-wrap: break-word;\n}\n@media (min-width: 768px) {\n    h1, .h1 { font-size: var(--text-5xl); line-height: var(--leading-5xl); }\n}\n\nh2, .h2 {\n    font-weight: var(--font-weight-regular);\n    font-size: var(--text-xl);\n    line-height: var(--leading-xl);\n    color: var(--fg-strong);\n    margin: var(--space-5) 0 var(--space-3);\n}\n@media (min-width: 768px) {\n    h2, .h2 { font-size: var(--text-3xl); margin-bottom: var(--space-4); }\n}\n\nh3, .h3 {\n    font-weight: var(--font-weight-regular);\n    font-size: var(--text-lg);\n    line-height: var(--leading-lg);\n    color: var(--fg-strong);\n    margin: var(--space-5) 0 var(--space-6);\n}\n@media (min-width: 768px) {\n    h3, .h3 { font-size: var(--text-xl); }\n}\n\nh4, .h4 {\n    font-weight: var(--font-weight-bold);\n    font-size: var(--text-base);\n    color: var(--fg-strong);\n    margin-bottom: var(--space-4);\n}\n@media (min-width: 768px) {\n    h4, .h4 { font-size: var(--text-lg); }\n}\n\np {\n    font-size: var(--text-base);\n    line-height: var(--leading-base);\n    margin-bottom: var(--space-3);\n}\n\n.meta, .eyebrow {\n    font-size: var(--text-xs);\n    line-height: var(--leading-xs);\n    font-weight: var(--font-weight-semibold);\n    text-transform: uppercase;\n    letter-spacing: var(--tracking-meta);\n    color: var(--fg-muted);\n    margin-bottom: var(--space-3);\n}\n.meta--dark { color: var(--fg-strong); }\n\na {\n    color: var(--fg-link);\n    transition: color var(--dur-base) var(--ease-standard);\n    cursor: pointer;\n}\na:hover { color: var(--fg-link-hover); }\n\n/* Body-of-content links invert: red -> neutral on hover */\n.content a,\n#content a {\n    color: var(--fg-accent);\n}\n.content a:hover,\n#content a:hover { color: var(--fg-default); }\n\ncode, pre code {\n    background: var(--color-gray-50);\n    color: var(--color-gray-900);\n    border: 1px solid var(--color-gray-100);\n    border-radius: var(--radius-md);\n    padding: 2px 8px;\n    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;\n    font-size: var(--text-sm);\n}\npre code {\n    display: block;\n    padding: var(--space-5);\n    margin: var(--space-10) 0;\n    overflow-x: auto;\n}\n\n/* Signature blockquote — red filled with ghost-outline “stamp” */\nblockquote {\n    position: relative;\n    padding: var(--space-6) var(--space-8);\n    margin: var(--space-8) 0;\n    background: var(--color-primary-accent);\n    color: var(--color-white);\n    border: 1px solid var(--color-primary-accent);\n    font-style: italic;\n}\nblockquote::before {\n    content: \"\";\n    position: absolute;\n    left: 12px; top: 12px;\n    width: 100%; height: 100%;\n    border: 1px solid var(--color-primary-accent);\n    pointer-events: none;\n}\nblockquote p { font-size: var(--text-lg); line-height: 1.6; }\nblockquote :last-child { margin-bottom: 0; }\n\n/* Red note set */\n.red-note {\n    background: var(--color-primary-accent);\n    color: var(--color-white);\n    padding: var(--space-8);\n}\n.red-note h3 { color: var(--color-white); margin: 0; }\n.red-note p { margin-top: var(--space-4); }\n<\u002Fstyle>\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"24a70a94-67c0-4280-972f-7d3253a99e1d\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4f7f9464-bbba-48bb-a2b4-9e830f2ca180\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"42a90b57-e2ea-491d-bbc6-00ac51345e4d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e31bb86f-1692-4ede-a28f-1a5e831e9a5d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, style=\"width:16px;height:16px;position:absolute;left:13px;top:13px;pointer-events:none\"><path fill-rule=\"evenodd\" d=\"M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z\" clip-rule=\"evenodd\"><\u002Fpath><\u002Fsvg>\n              <input type=\"text\" value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Zoek in best practices…\" style=\"width:100%;padding:11px 12px 11px 36px;border:1px solid #ECECEC;border-radius:0;background:#FEFEFE;font-family:inherit;font-size:14px;color:#090910;outline:none\" style-focus=\"border-color:#FF2D20;box-shadow:inset 0 0 0 1px #FF2D20\">\n            <\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#848487;margin:0 0 12px 12px\">Categorieën<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <sc-for list=\"{{ cats }}\" as=\"cat\" hint-placeholder-count=\"8\">\n                <button class=\"bp-srow {{ cat.cls }}\" type=\"button\" onclick=\"{{ cat.onClick }}\" style=\"{{ cat.style }}\">\n                  <span style=\"flex:1;min-width:0\">{{ cat.title }}<\u002Fspan>\n                  <span style=\"{{ cat.badgeStyle }}\">{{ cat.countText }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ inDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <button type=\"button\" onclick=\"{{ onBack }}\" style=\"display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:#090910;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:0;margin-bottom:28px\" style-hover=\"color:#FF2D20\">\n              <span style=\"font-size:16px\">←<\u002Fspan> Terug naar overzicht\n            <\u002Fbutton>\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#848487;margin-bottom:14px\">Op deze pagina<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"5\">\n                <button type=\"button\" onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.text }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Faside>\n\n      <section>\n        <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"color:#848487;font-size:15px;padding:40px 0\">Best practices laden…<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ inList }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <h2 style=\"font-size:26px;font-weight:700;color:#090910;margin:0 0 6px\">{{ listHeading }}<\u002Fh2>\n            <p style=\"font-size:15px;line-height:1.55;color:#525257;margin:0 0 28px;max-width:640px\">{{ listSub }}<\u002Fp>\n            <sc-if value=\"{{ hasCards }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:18px\">\n                <sc-for list=\"{{ cards }}\" as=\"p\" hint-placeholder-count=\"6\">\n                  <div class=\"bp-card\" onclick=\"{{ p.onClick }}\" style=\"{{ cardStyle }}\">\n                    <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#FF2D20;margin-bottom:9px\">{{ p.catTitle }}<\u002Fdiv>\n                    <div style=\"font-size:19px;font-weight:700;color:#090910;line-height:1.3;margin-bottom:8px\">{{ p.title }}<\u002Fdiv>\n                    <div style=\"font-size:14.5px;line-height:1.55;color:#525257;margin-bottom:14px\">{{ p.summary }}<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#090910\">Lees meer <span class=\"bp-arrow\" style=\"transition:transform .2s,color .2s\">→<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noCards }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px dashed #DADADF;padding:40px;text-align:center;color:#848487;font-size:15px\">Geen best practices gevonden. Probeer een andere zoekterm of categorie.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ inEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#FF2D20;margin-bottom:10px\">Categorie<\u002Fdiv>\n            <h2 style=\"font-size:26px;font-weight:700;color:#090910;margin:0 0 12px\">{{ emptyTitle }}<\u002Fh2>\n            <p style=\"font-size:15px;line-height:1.6;color:#525257;margin:0 0 28px;max-width:620px\">{{ emptyDesc }}<\u002Fp>\n            <div style=\"background:#F5F5FA;border-left:3px solid #FF2D20;padding:22px 26px;color:#525257;font-size:15px;line-height:1.6\">Deze sectie wordt incrementeel uitgebouwd. De best practices voor deze categorie worden binnenkort toegevoegd.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ inDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <article style=\"max-width:720px\">\n            <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#FF2D20;margin-bottom:12px\">{{ selCat }}<\u002Fdiv>\n            <h1 style=\"font-size:38px;line-height:1.15;font-weight:700;color:#090910;margin:0 0 16px\">{{ selTitle }}<\u002Fh1>\n            <a href=\"{{ selGithub }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#848487;text-decoration:none;margin-bottom:26px;border-bottom:1px solid transparent\" style-hover=\"color:#FF2D20\">\n              <svg viewBox=\"0 0 16 16\" width=\"15\" height=\"15\" fill=\"currentColor\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>\n              Verbeter deze pagina op GitHub\n            <\u002Fa>\n            <div ref=\"{{ contentRef }}\" class=\"bp-content\"><\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer style=\"background:#090910;color:rgba(255,255,255,.7);font-size:14px;flex-shrink:0\">\n    <div style=\"max-width:1152px;margin:0 auto;padding:72px 40px 36px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px\">\n      <div>\n        <img src=\"af9cfc1b-199c-49ff-8208-ef441dcb44c0\" alt=\"\" style=\"width:170px;margin-bottom:22px;filter:brightness(0) invert(1)\">\n        <p style=\"color:rgba(255,255,255,.6);line-height:1.65;max-width:340px;margin:0\">De Dutch Laravel Foundation brengt Nederlandse Laravel-bedrijven en -developers samen rond kennisdeling, events en promotie van Laravel.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px\">Over DLF<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Over ons<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Bestuur<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Contact<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Lid worden<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px\">Community<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Leden<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Partners<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Agenda<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Nieuws<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px\">Resources<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <a href=\"#\" style=\"color:#fff;text-decoration:none;font-weight:700\">Best Practices<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Cases<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Stagebank<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.75);text-decoration:none\">Wat is Laravel?<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,.1);max-width:1152px;margin:0 auto;padding:22px 40px;font-size:12px;color:rgba(255,255,255,.4);display:flex;justify-content:space-between\">\n      <span>© Stichting Dutch Laravel Foundation — {{ year }}<\u002Fspan>\n      <span>Privacy · Voorwaarden<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;showComingSoon&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  state = { data:null, query:'', activeCat:null, selected:null, libsReady:false, toc:[], activeSection:null };\n\n  constructor(props){ super(props); this.contentRef = React.createRef(); this.renderedKey = null; }\n\n  componentDidMount(){\n    const __dataSrc = (window.__resources && window.__resources.practicesData) || './practices-data.js';\n    import(__dataSrc).then(m=>this.setState({data:m.data})).catch(e=>console.error('data load',e));\n    this._poll = setInterval(()=>{ if(window.marked && window.hljs){ clearInterval(this._poll); this.setState({libsReady:true}); } }, 120);\n    this._onScroll = ()=>{ if(this._raf) return; this._raf = requestAnimationFrame(()=>{ this._raf=null; this.updateActive(); }); };\n    window.addEventListener('scroll', this._onScroll, {passive:true});\n  }\n  componentWillUnmount(){ clearInterval(this._poll); window.removeEventListener('scroll', this._onScroll); }\n  componentDidUpdate(){ this.maybeRenderDetail(); }\n\n  maybeRenderDetail(){\n    const s = this.state;\n    if(!s.selected){ this.renderedKey = null; return; }\n    const el = this.contentRef.current;\n    if(!el || !window.marked) return;\n    const key = s.selected.catSlug + '/' + s.selected.slug;\n    if(this.renderedKey === key) return;\n    this.renderedKey = key;\n    let html;\n    try { html = window.marked.parse(s.selected.body); } catch(e){ html = '<pre>'+String(s.selected.body)+'<\u002Fpre>'; }\n    el.innerHTML = html;\n    if(window.hljs){ el.querySelectorAll('pre code').forEach(b=>{ try{ window.hljs.highlightElement(b); }catch(e){} }); }\n    el.querySelectorAll('a').forEach(a=>{ a.target='_blank'; a.rel='noopener'; });\n    const toc = [];\n    el.querySelectorAll('h2').forEach((h,i)=>{ const id='sec-'+i; h.id=id; toc.push({ id, text:h.textContent }); });\n    this.setState({ toc, activeSection: toc.length? toc[0].id : null });\n  }\n\n  updateActive(){\n    const s = this.state;\n    if(!s.selected || !s.toc.length) return;\n    const el = this.contentRef.current; if(!el) return;\n    let cur = s.toc[0].id;\n    for(const t of s.toc){ const h = el.querySelector('#'+t.id); if(h && h.getBoundingClientRect().top <= 180) cur = t.id; }\n    if(cur !== s.activeSection) this.setState({ activeSection: cur });\n  }\n\n  scrollTo(id){\n    const el = this.contentRef.current; if(!el) return;\n    const h = el.querySelector('#'+id); if(!h) return;\n    const y = window.scrollY + h.getBoundingClientRect().top - 120;\n    window.scrollTo({ top:y, behavior:'smooth' });\n  }\n\n  open(catSlug, slug){\n    const cat = this.state.data.categories.find(c=>c.slug===catSlug);\n    const p = cat.practices.find(x=>x.slug===slug);\n    this.setState({ selected:{ catSlug, catTitle:cat.title, slug, title:p.title, body:p.body }, toc:[] });\n    window.scrollTo({ top:0 });\n  }\n  back(){ this.setState({ selected:null, toc:[] }); }\n  setQuery(v){ this.setState({ query:v, selected:null }); }\n  pickCat(slug){ this.setState({ activeCat:slug, query:'', selected:null }); }\n\n  renderVals(){\n    const s = this.state;\n    const RED='#FF2D20', DARK='#090910', BODY='#525257', MUTE='#848487';\n    const loading = !s.data;\n\n    if(loading){\n      return { showBrowse:true, inDetail:false, isLoading:true, inList:false, inEmpty:false,\n        cats:[], query:'', onSearch:()=>{}, toc:[], year:new Date().getFullYear() };\n    }\n\n    const showComingSoon = this.props.showComingSoon ?? true;\n    const compact = (this.props.density ?? 'comfortable') === 'compact';\n    const cats = s.data.categories;\n    const all = [];\n    cats.forEach(c=> c.practices.forEach(p=> all.push({ ...p, catSlug:c.slug, catTitle:c.title })));\n    const filledCount = cats.filter(c=>c.count>0).length;\n\n    // mode\n    let mode;\n    if(s.selected) mode='detail';\n    else if(s.query) mode='list';\n    else if(s.activeCat){ const c = cats.find(x=>x.slug===s.activeCat); mode = (c && c.count===0) ? 'empty' : 'list'; }\n    else mode='list';\n\n    // sidebar category rows\n    const rowBase = 'display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 12px;border:0;font-family:inherit;font-size:14px;line-height:1.3;transition:background .15s;';\n    const mkRow = (it)=>{\n      const active = it.isActive;\n      const style = rowBase\n        + 'background:'+(active?RED:'transparent')+';'\n        + 'color:'+(it.disabled?'#A6A6AB':(active?'#fff':DARK))+';'\n        + 'font-weight:'+(active?700:600)+';'\n        + 'cursor:pointer;';\n      const badgeStyle = it.disabled\n        ? 'font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#B6B6BB;flex-shrink:0'\n        : 'font-size:12px;font-weight:700;min-width:22px;text-align:center;flex-shrink:0;color:'+(active?'#fff':MUTE);\n      return { title:it.title, countText: it.disabled ? 'Binnenkort' : String(it.count), style, badgeStyle, onClick: it.onClick, cls: active ? 'bp-srow--active' : '' };\n    };\n    const catRows = [];\n    catRows.push(mkRow({ title:'Alle categorieën', count:all.length, isActive:(!s.query && !s.activeCat), disabled:false, onClick:()=>this.pickCat(null) }));\n    cats.forEach(c=>{\n      if(c.count===0 && !showComingSoon) return;\n      catRows.push(mkRow({ title:c.title, count:c.count, isActive:(!s.query && s.activeCat===c.slug), disabled:c.count===0, onClick: (()=>this.pickCat(c.slug)) }));\n    });\n\n    // list cards\n    let pool;\n    if(s.query){ const q=s.query.toLowerCase(); pool = all.filter(p=> (p.title+' '+p.summary+' '+p.body).toLowerCase().includes(q)); }\n    else if(s.activeCat){ pool = all.filter(p=>p.catSlug===s.activeCat); }\n    else pool = all;\n    const cards = pool.map(p=>({ title:p.title, summary:p.summary, catTitle:p.catTitle, onClick:()=>this.open(p.catSlug,p.slug) }));\n    const cardStyle = 'background:#fff;border:1px solid #ECECEC;padding:'+(compact?'18px 20px':'24px 26px')+';cursor:pointer;transition:background .18s,border-color .18s,color .18s';\n\n    let listHeading='', listSub='';\n    if(s.query){ listHeading='Zoekresultaten'; listSub = cards.length + ' ' + (cards.length===1?'resultaat':'resultaten') + ' voor “' + s.query + '”'; }\n    else if(s.activeCat){ const c = cats.find(x=>x.slug===s.activeCat); listHeading = c.title; listSub = c.description; }\n    else { listHeading='Alle best practices'; listSub = 'Doorzoek ' + all.length + ' richtlijnen uit ' + filledCount + ' categorieën, samengesteld door de Dutch Laravel Foundation community.'; }\n\n    // empty\n    let emptyTitle='', emptyDesc='';\n    if(mode==='empty'){ const c = cats.find(x=>x.slug===s.activeCat); emptyTitle=c.title; emptyDesc=c.description || ''; }\n\n    // toc\n    const tocBase = 'text-align:left;border:0;background:transparent;font-family:inherit;font-size:13.5px;line-height:1.4;padding:6px 12px;cursor:pointer;border-left:2px solid transparent;transition:color .15s,border-color .15s;';\n    const toc = s.toc.map(t=>({ text:t.text, onClick:()=>this.scrollTo(t.id),\n      style: tocBase + (t.id===s.activeSection\n        ? 'color:'+RED+';border-left-color:'+RED+';font-weight:700;'\n        : 'color:'+BODY+';font-weight:600;') }));\n\n    const sel = s.selected;\n    return {\n      year: new Date().getFullYear(),\n      isLoading:false,\n      showBrowse: mode!=='detail',\n      inDetail: mode==='detail',\n      inList: mode==='list',\n      inEmpty: mode==='empty',\n      query: s.query,\n      onSearch: (e)=>this.setQuery(e.target.value),\n      onBack: ()=>this.back(),\n      cats: catRows,\n      cards, cardStyle,\n      hasCards: cards.length>0,\n      noCards: cards.length===0,\n      listHeading, listSub,\n      emptyTitle, emptyDesc,\n      toc,\n      contentRef: this.contentRef,\n      selCat: sel ? sel.catTitle : '',\n      selTitle: sel ? sel.title : '',\n      selGithub: sel ? ('https://github.com/Dutch-Laravel-Foundation/best-practices/blob/main/'+sel.catSlug+'/'+sel.slug+'.md') : '#'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
