<nav class="editorial-breadcrumb" aria-label="Kruimelpad">
    <a class="editorial-breadcrumb__link" href="{{ href }}">{{ label }}</a>
    <span class="editorial-breadcrumb__separator" aria-hidden="true">/</span>
    {{ if current_href }}
        <a class="editorial-breadcrumb__current" href="{{ current_href }}">{{ current }}</a>
    {{ else }}
        <span class="editorial-breadcrumb__current" aria-current="page">{{ current }}</span>
    {{ /if }}
</nav>
