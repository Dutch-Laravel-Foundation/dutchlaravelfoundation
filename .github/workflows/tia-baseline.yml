name: TIA baseline

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      LARAVEL_TOOLBAR_ENABLED: 'false'
      INERTIA_SSR_ENABLED: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select source branch for TIA
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git switch -C "$SOURCE_BRANCH"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: pcov
          tools: composer:v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p users storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction
      - name: Build frontend and SSR assets
        run: |
          npm ci --no-audit --no-fund
          bun run build
      - name: Record the full TIA baseline
        run: vendor/bin/pest --tia --fresh --compact --no-coverage
      - name: Locate baseline
        id: baseline
        run: echo "path=$(vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"
      - name: Publish successful main baseline
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pest-tia-baseline
          path: ${{ steps.baseline.outputs.path }}/
          if-no-files-found: error
          retention-days: 90
