name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      LARAVEL_TOOLBAR_ENABLED: 'false'
      INERTIA_SSR_ENABLED: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p users storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction
      - name: Build frontend and SSR assets
        run: |
          npm ci --no-audit --no-fund
          bun run build
      - name: Run the full Pest suite
        run: vendor/bin/pest --parallel --processes=4 --compact

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          cp .env.example .env
          mkdir -p users storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction
          npm ci --no-audit --no-fund
      - name: Pint
        run: composer lint
      - name: PHPStan
        run: composer analyse
      - name: JavaScript tests and type checking
        run: |
          bun run test
          bun run typecheck

  # A new advisory in a dependency the change does not touch only warns, so unrelated
  # pull requests stay green. A change to a manifest or lockfile must pass the audit.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Detect dependency changes
        id: deps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git diff --name-only "$BASE_SHA...HEAD" -- composer.json composer.lock package.json package-lock.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dependency audits
        env:
          DEPENDENCIES_CHANGED: ${{ steps.deps.outputs.changed }}
        run: |
          if composer audit:dependencies; then
            exit 0
          fi
          if [ "$DEPENDENCIES_CHANGED" = "true" ]; then
            echo "::error::This change touches dependencies and the audit found advisories. Fix them before merging."
            exit 1
          fi
          echo "::warning::The audit found advisories in dependencies this change does not touch. Fix them in a separate pull request."
